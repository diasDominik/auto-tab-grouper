<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/assets/shot-frame.css" />
    <style>
      .stage {
        background: linear-gradient(
          145deg,
          #11151c 0%,
          #161b24 45%,
          #131a17 100%
        );
      }
      .stage::before {
        background: radial-gradient(
          ellipse at 30% 40%,
          rgba(10, 132, 255, 0.22),
          transparent 60%
        );
      }
      .stage::after {
        background: radial-gradient(
          ellipse at 70% 70%,
          rgba(238, 119, 17, 0.18),
          transparent 60%
        );
      }
      .caption {
        color: #f2f5fa;
      }
      .caption p {
        color: #9fb0c8;
      }
      .device {
        background: #1d1d1f;
        box-shadow:
          0 2px 6px rgba(0, 0, 0, 0.4),
          0 24px 60px rgba(0, 0, 0, 0.55);
      }
      .device,
      .device iframe {
        width: 900px;
        height: 712px;
      }
      .device {
        transform: scale(0.8);
        transform-origin: top center;
      }
      .scaled {
        height: 570px;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="caption">
        <h1>Light, dark, and system themes</h1>
        <p>Export your rules to JSON and carry them to another machine.</p>
      </div>
      <div class="scaled">
        <div class="device">
          <iframe src="/assets/shot-options.html?theme=dark"></iframe>
        </div>
      </div>
    </div>
  </body>
</html>
