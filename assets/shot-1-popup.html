<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/assets/shot-frame.css" />
    <style>
      /* 352 = the popup's 320px body width plus its 16px padding each side. */
      .device,
      .device iframe {
        width: 352px;
        height: 412px;
      }
      .device {
        transform: scale(1.4);
        transform-origin: top center;
      }
      .scaled {
        height: 577px;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="caption">
        <h1>Your tabs, grouped the moment they open</h1>
        <p>Set a rule once. Every matching tab lands in the right group.</p>
      </div>
      <div class="scaled">
        <div class="device">
          <iframe src="/assets/shot-popup.html?theme=light"></iframe>
        </div>
      </div>
    </div>
  </body>
</html>
