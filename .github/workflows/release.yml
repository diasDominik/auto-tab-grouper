name: Package

# Builds the Chrome Web Store upload ZIP. Nothing is published automatically:
# the archive is attached as a workflow artifact (and to a GitHub Release when
# triggered by a tag) for manual upload to the store.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 1.4.0). Defaults to manifest.json."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Never ship something that would not have passed CI.
      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check .

      - name: Test
        run: node --test

      - name: Verify store assets
        run: node tools/verify-store-assets.mjs

      # The tag is the source of truth for a release: stamp it into the
      # manifest so the ZIP always carries the version you tagged, instead of
      # failing when the committed manifest has not been bumped. This edits the
      # checkout only; nothing is committed back.
      - name: Stamp version
        # The input arrives through the environment rather than through ${{ }}
        # interpolation, which would splice it into the shell command itself.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            node tools/set-version.mjs "$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node tools/set-version.mjs "$GITHUB_REF_NAME"
          else
            echo "No tag or input given; keeping the committed manifest version."
          fi

      - name: Read version
        id: manifest
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: node tools/build-package.mjs

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-tab-grouper-v${{ steps.manifest.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

      # The listing images are not part of the upload ZIP, but they are what
      # you fill the store listing in with, so ship them alongside.
      - name: Upload store listing images
        uses: actions/upload-artifact@v4
        with:
          name: store-listing-images-v${{ steps.manifest.outputs.version }}
          path: store-assets/*.png
          if-no-files-found: error
          retention-days: 90

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
          generate_release_notes: true
